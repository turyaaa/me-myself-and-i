<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Ranking Game</title>
<style>
  :root { --bg:#2a0f16; --ink:#f4e8ea; --card:#3e1923; --line:#6d2c3b; --muted:#c9a3ab; --accent:#b8334f; --bar:rgba(255,255,255,.09); --icon:#e58a9b; --ok:#43b27a; --mid:#e8b030; --bad:#e8604f; }
  :root[data-theme="light"] { --bg:#f7f0f1; --ink:#2a0f16; --card:#ffffff; --line:#dcc7cb; --muted:#7d5a62; --accent:#8c1f3a; --bar:rgba(140,31,58,.12); --icon:#8c1f3a; --ok:#2f8f5b; --mid:#d9902f; --bad:#c4473a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 Georgia, "Times New Roman", serif; padding:16px; max-width:520px; margin-inline:auto; min-height:100vh; display:flex; flex-direction:column; }
  [hidden] { display:none !important; }
  #sound { position:fixed; top:max(10px, env(safe-area-inset-top)); right:54px; width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--muted); padding:7px; cursor:pointer; z-index:20; }
  #sound[aria-pressed="true"] { color:var(--icon); border-color:var(--icon); }
  #sound svg { display:block; width:100%; height:100%; }
  #theme { position:fixed; top:max(10px, env(safe-area-inset-top)); right:12px; width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink); font:16px system-ui; padding:0; cursor:pointer; z-index:20; }
  .logo { color:var(--ink); }
  .logo-main { display:block; width:min(300px, 78%); height:auto; margin:12px auto 22px; }
  /* Home branding shares the navigation's top edge; side lanes reserve controls. */
  body.wide.home-view { padding-top:max(10px, env(safe-area-inset-top)); }
  .home-view .logo-main { width:min(300px, calc(100vw - 208px)); margin:0 auto 22px; }
  .title { font:400 28px Georgia, serif; text-align:center; margin:48px 0 10px; }
  .sub { font:15px/1.5 system-ui, sans-serif; color:var(--muted); text-align:center; margin:0 0 36px; }
  .menu-btn { display:block; width:100%; text-align:left; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:18px 16px; margin-bottom:16px; font:20px Georgia, serif; cursor:pointer; }
  .menu-btn small { display:block; font:13px system-ui, sans-serif; color:var(--muted); margin-top:2px; }
  .menu-btn small:empty { display:none; }
  .top { display:flex; justify-content:center; align-items:center; font:14px system-ui, sans-serif; color:var(--muted); padding:8px 0; margin-bottom:14px; }
  #back { position:fixed; top:max(10px, env(safe-area-inset-top)); left:54px; height:34px; padding:0 14px; border-radius:17px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:14px system-ui, sans-serif; cursor:pointer; z-index:20; }
  .task { font-size:21px; margin:10px 0 8px; }
  .hint { font:13px system-ui, sans-serif; color:var(--muted); margin-bottom:18px; }
  body.wide { max-width:none; padding:16px 24px; }
  #game .task, #game .hint { text-align:center; }
  .modes { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:14px; margin-bottom:30px; }
  .mode { display:flex; flex-direction:column; align-items:flex-start; gap:8px; min-height:176px; padding:24px; text-align:left; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:14px; cursor:pointer; font:inherit; }
  .mode svg { width:54px; height:54px; margin-bottom:6px; color:var(--icon); fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
  .mode .mt { font:26px Georgia, serif; }
  .mode small { font:14px/1.45 system-ui, sans-serif; color:var(--muted); }
  #records h3 { margin:0 0 10px; font:600 13px system-ui, sans-serif; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .recs { display:flex; flex-wrap:wrap; gap:8px; }
  .rec { padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--card); font:14px system-ui, sans-serif; }
  .rec b { margin-left:6px; color:var(--icon); }
  #groups { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:14px; }
  .tile { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; aspect-ratio:1; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:14px; padding:10px; font:18px Georgia, serif; cursor:pointer; }
  .tile.all { grid-column:1 / -1; aspect-ratio:auto; flex-direction:row; padding:18px; gap:16px; }
  .tile svg { width:44px; height:44px; flex:none; color:var(--icon); fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .tcap { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .tile.all .tcap { align-items:flex-start; }
  .tile small { font:12px system-ui, sans-serif; color:var(--muted); }
  .tile small:empty { display:none; }
  #list { display:flex; flex-direction:column; gap:8px; position:relative; }
  .card { position:relative; display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:none; cursor:grab; transition:transform .15s; }
  #list.settle .card { transition:none; }
  #list.locked .card { touch-action:auto; cursor:default; }
  .card.drag { z-index:5; transition:none; box-shadow:0 10px 24px rgba(0,0,0,.4); border-color:var(--accent); cursor:grabbing; }
  .num { flex:none; width:28px; height:28px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font:700 14px system-ui, sans-serif; color:var(--muted); position:relative; z-index:1; }
  .mark { flex:none; min-width:36px; text-align:center; font:700 18px system-ui, sans-serif; position:relative; z-index:1; }
  .mark:empty { display:none; }
  .name { flex:1; font-size:18px; position:relative; z-index:1; }
  .val { font:14px system-ui, sans-serif; color:var(--muted); text-align:right; position:relative; z-index:1; }
  .val b { color:var(--ink); }
  .bar { position:absolute; left:0; top:0; bottom:0; background:var(--bar); z-index:0; }
  .card.ok, .card.mid, .card.bad { border-width:4px; padding:9px; }
  .card.ok { border-color:var(--ok); } .card.mid { border-color:var(--mid); } .card.bad { border-color:var(--bad); }
  .card.ok .mark { color:var(--ok); } .card.mid .mark { color:var(--mid); } .card.bad .mark { color:var(--bad); }

  /* ---------- вікторина ---------- */
  body.quiz { padding-bottom:132px; }
  #board { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:6px; }
  .bh { display:flex; align-items:center; justify-content:center; text-align:center; min-height:46px; padding:4px 1px; font:700 11px/1.15 system-ui, sans-serif; color:var(--muted); overflow-wrap:anywhere; hyphens:auto; text-transform:uppercase; }
  .bc { height:60px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:700 17px system-ui, sans-serif; cursor:pointer; }
  .bc:disabled { opacity:.22; cursor:default; }
  #qview { position:fixed; left:0; right:0; top:0; bottom:calc(98px + env(safe-area-inset-bottom)); z-index:12; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:64px 22px 16px; text-align:center; cursor:pointer; overflow-y:auto; }
  .qmeta { font:600 15px system-ui, sans-serif; letter-spacing:.04em; color:var(--muted); }
  .qtext { max-width:1100px; font-size:clamp(26px, 5.4vw, 54px); line-height:1.3; }
  .qans { max-width:1100px; font-size:clamp(24px, 4.8vw, 46px); line-height:1.25; font-weight:700; color:var(--ok); }
  .qnote { max-width:760px; min-height:24px; font:16px/1.5 system-ui, sans-serif; }
  .qhint { font:13px system-ui, sans-serif; color:var(--muted); }
  #qactions { display:flex; gap:10px; width:100%; max-width:560px; }
  #qactions button, #qend button { flex:1; padding:14px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:600 17px system-ui, sans-serif; cursor:pointer; }
  #qactions button.good { background:var(--ok); }
  #qactions button.bad { background:var(--bad); }
  #qactions button.alt, #qend button.alt { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  #qend h2 { text-align:center; font:400 26px Georgia, serif; margin:20px 0 16px; }
  .endrow { display:flex; justify-content:space-between; gap:12px; padding:14px; margin-bottom:8px; background:var(--card); border:1px solid var(--line); border-radius:10px; font-size:18px; }
  .endrow.win { border:3px solid var(--ok); }
  .endrow b { font-family:system-ui, sans-serif; }
  #qend .btns { display:flex; gap:10px; margin-top:16px; }
  #players { position:fixed; left:0; right:0; bottom:0; z-index:15; display:flex; gap:8px; background:var(--card); border-top:1px solid var(--line); padding:8px 8px calc(8px + env(safe-area-inset-bottom)); }
  .plrow { display:flex; gap:6px; flex:1; min-width:0; overflow-x:auto; }
  .pl { flex:1 0 104px; max-width:170px; border:1px solid var(--line); border-radius:10px; padding:4px 4px 6px; text-align:center; background:var(--bg); }
  .pl.cur { border:2px solid var(--accent); padding:3px 3px 5px; }
  .pts { font:700 22px system-ui, sans-serif; }
  .pl input { width:100%; border:0; background:transparent; color:var(--ink); text-align:center; font:16px system-ui, sans-serif; padding:2px 0; outline:none; }
  .pctl { display:flex; flex-direction:column; gap:6px; }
  .pctl button { flex:1; width:36px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:600 18px system-ui, sans-serif; cursor:pointer; }
  .pctl button:disabled { opacity:.3; cursor:default; }
  .wbtn, #btn { width:100%; padding:14px; font:600 17px system-ui, sans-serif; border:0; border-radius:10px; background:var(--accent); color:#fff; margin-top:6px; cursor:pointer; }
  #result { font:15px/1.5 system-ui, sans-serif; margin:18px 0 14px; min-height:22px; }
  .footer { margin-top:auto; padding:56px 0 20px; text-align:center; }
  .footer .logo { display:block; width:88px; height:auto; margin:0 auto 14px; opacity:.92; }
  .footer p { margin:0; font:12px system-ui, sans-serif; color:var(--muted); }
  .wbtn.alt { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .wbtn:disabled { opacity:.4; cursor:default; }
  .pool { display:flex; flex-direction:column; align-items:flex-start; gap:4px; width:100%; margin-bottom:12px; padding:18px; text-align:left; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:12px; font:22px Georgia, serif; cursor:pointer; }
  .pool small { font:13px system-ui, sans-serif; color:var(--muted); }
  .pool:disabled { opacity:.45; cursor:default; }
  .bc:empty { visibility:hidden; }
  .gq { margin:8px 0 20px; font-size:clamp(26px, 6vw, 40px); line-height:1.25; text-align:center; }
  #gslider { width:100%; accent-color:var(--accent); }
  .gscale { display:flex; justify-content:space-between; margin:4px 0 14px; font:12px system-ui, sans-serif; color:var(--muted); }
  .gcap, .gerr { min-height:20px; margin-bottom:10px; text-align:center; font:13px/1.45 system-ui, sans-serif; color:var(--muted); }
  .gerr { color:var(--bad); }
  .gtrack { position:relative; height:10px; margin:50px 12px 58px; border-radius:5px; background:var(--line); }
  .gmk { position:absolute; top:-7px; width:4px; height:24px; border-radius:2px; background:var(--accent); transform:translateX(-2px); }
  .gmk.t { background:var(--ok); }
  .gmk span { position:absolute; top:30px; left:50%; transform:translateX(-50%); white-space:nowrap; font:12px system-ui, sans-serif; color:var(--ink); }
  .gmk.t span { top:-24px; }
  .gpts { margin-bottom:8px; text-align:center; font:700 46px system-ui, sans-serif; }
  #gtext { margin-bottom:12px; text-align:center; white-space:pre-line; font:16px/1.6 system-ui, sans-serif; }
  .fld { display:block; width:100%; margin-bottom:8px; padding:12px; font:16px system-ui, sans-serif; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:10px; outline:none; }
  textarea.fld { resize:vertical; }
  .qrow { margin:14px 0; }
  .qlab { margin-bottom:4px; font:700 14px system-ui, sans-serif; color:var(--icon); }
  .ccrow { display:flex; align-items:center; gap:8px; padding:12px; margin-bottom:8px; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .cct { flex:1; min-width:0; font-size:18px; overflow-wrap:anywhere; }
  .cct small { display:block; font:12px system-ui, sans-serif; color:var(--muted); }
  .ccrow button, .xrow button { padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:var(--accent); color:#fff; font:600 14px system-ui, sans-serif; cursor:pointer; }
  .ccrow button.alt, .xrow button.alt { background:var(--card); color:var(--ink); }
  .xrow { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  .xrow .wbtn { flex:1; width:auto; margin:0; padding:14px; font-size:17px; }
  #editor h3 { margin:26px 0 8px; font:600 13px system-ui, sans-serif; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  #xmsg { min-height:22px; margin-top:6px; font:14px/1.5 system-ui, sans-serif; color:var(--muted); }
  #xfile { max-width:100%; font:14px system-ui, sans-serif; color:var(--muted); }
  #menubtn { position:fixed; top:max(10px, env(safe-area-inset-top)); left:12px; width:34px; height:34px; padding:0; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink); font:18px system-ui, sans-serif; cursor:pointer; z-index:20; }
  #sbback { position:fixed; inset:0; z-index:39; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .2s; }
  #sbback.open { opacity:1; pointer-events:auto; }
  #sidebar { position:fixed; top:0; left:0; bottom:0; z-index:40; width:min(320px, 86vw); display:flex; flex-direction:column; gap:2px; padding:16px 12px calc(16px + env(safe-area-inset-bottom)); background:var(--card); border-right:1px solid var(--line); overflow-y:auto; transform:translateX(-102%); visibility:hidden; transition:transform .22s, visibility .22s; }
  #sidebar.open { transform:none; visibility:visible; }
  .sbh { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; font:20px Georgia, serif; }
  .sbh button { width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:18px system-ui, sans-serif; cursor:pointer; }
  .sbt { margin:16px 8px 6px; font:600 12px system-ui, sans-serif; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .sbi { display:flex; align-items:center; gap:12px; width:100%; padding:10px; border:0; border-radius:10px; background:none; color:var(--ink); font:16px system-ui, sans-serif; text-align:left; cursor:pointer; }
  .sbi:hover { background:var(--bg); }
  .sbi.cur { background:var(--bg); box-shadow:inset 3px 0 0 var(--accent); }
  .sbi svg { width:22px; height:22px; flex:none; color:var(--icon); fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .sbtabs { display:flex; gap:6px; margin:0 6px 8px; }
  .sbtabs button { flex:1; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:13px system-ui, sans-serif; cursor:pointer; }
  .sbtabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .sblegal { display:flex; flex-direction:column; margin-top:auto; padding-top:18px; }
  .sblegal button { padding:6px 10px; border:0; background:none; color:var(--muted); font:12px system-ui, sans-serif; text-align:left; text-decoration:underline; cursor:pointer; }
  .flinks { display:flex; flex-wrap:wrap; justify-content:center; gap:4px 16px; margin-bottom:10px; }
  .flinks button { padding:4px; border:0; background:none; color:var(--muted); font:12px system-ui, sans-serif; text-decoration:underline; cursor:pointer; }
  .ltext { font:15px/1.65 system-ui, sans-serif; }
  .ltext h3 { margin:22px 0 6px; font:600 17px Georgia, serif; }
  .ltext p { margin:0 0 10px; }
  .ltext .upd { color:var(--muted); font-size:13px; }
  .ltext table { width:100%; margin:10px 0; border-collapse:collapse; }
  .ltext th, .ltext td { padding:8px; border:1px solid var(--line); text-align:left; vertical-align:top; font-size:13px; }
  #lactions { margin-top:18px; }
  .gin { display:flex; flex-direction:column; align-items:center; gap:6px; margin-bottom:20px; }
  .gin input { box-sizing:border-box; -webkit-appearance:none; appearance:none; width:min(100%, 320px); margin:0; padding:12px; font:700 34px system-ui, sans-serif; text-align:center; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:12px; outline:none; }
  .gin input:focus { border-color:var(--accent); }
  .gunit { min-height:20px; font:15px system-ui, sans-serif; color:var(--muted); text-align:center; }
  #gform { max-width:460px; margin:0 auto; }
  /* ---------- анімації ---------- */
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @keyframes popIn { 0% { opacity:0; transform:scale(.6); } 60% { transform:scale(1.12); } 100% { opacity:1; transform:scale(1); } }
  @keyframes revealIn { from { opacity:0; transform:translateY(-12px) scale(.96); } to { opacity:1; transform:none; } }
  @keyframes shake { 0%, 100% { transform:translateX(0); } 20% { transform:translateX(-6px); } 40% { transform:translateX(5px); } 60% { transform:translateX(-4px); } 80% { transform:translateX(3px); } }
  @keyframes bump { 0% { transform:scale(1); } 35% { transform:scale(1.4); color:var(--ok); } 100% { transform:scale(1); } }
  @keyframes spinIcon { to { transform:rotate(360deg); } }
  @keyframes toastIn { 0% { opacity:0; transform:translate(-50%, -12px); } 12%, 82% { opacity:1; transform:translate(-50%, 0); } 100% { opacity:0; transform:translate(-50%, -8px); } }
  @keyframes confettiFall { to { transform:translate(var(--dx), 108vh) rotate(720deg); } }
  .enter { animation:fadeIn .3s ease; }
  .logo-main { animation:fadeUp .6s ease backwards; }
  .tile, .mode, .cluster, .pool, .ccrow, .endrow, .rec { animation:fadeUp .4s ease backwards; animation-delay:calc(var(--i, 0) * 35ms); }
  .tile, .mode { transition:transform .15s, box-shadow .15s, border-color .15s; }
  .tile:hover, .mode:hover { transform:translateY(-3px); border-color:var(--accent); box-shadow:0 8px 20px rgba(0,0,0,.25); }
  .tile:active, .mode:active { transform:scale(.97); }
  .tile.spin svg { animation:spinIcon .5s linear infinite; }
  .bc { transition:transform .12s, background .12s, border-color .12s; animation:popIn .35s ease backwards; animation-delay:calc(var(--i, 0) * 25ms); }
  .bc:not(:disabled):hover { transform:scale(1.07); background:var(--bg); border-color:var(--accent); }
  .bc:not(:disabled):active { transform:scale(.95); }
  .card { animation:fadeUp .35s ease backwards; animation-delay:calc(var(--i, 0) * 50ms); }
  .card.reveal { animation:revealIn .45s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay:calc(var(--i, 0) * 90ms); }
  .card.reveal.bad { animation:revealIn .45s cubic-bezier(.2, .8, .2, 1) backwards, shake .45s ease; animation-delay:calc(var(--i, 0) * 90ms), calc(var(--i, 0) * 90ms + 450ms); }
  .card.reveal .mark { animation:popIn .4s ease backwards; animation-delay:calc(var(--i, 0) * 90ms + 250ms); }
  .bar { transition:width .9s cubic-bezier(.2, .8, .2, 1) .2s; }
  #qview:not([hidden]) .qtext { animation:fadeUp .45s ease backwards; }
  #qview:not([hidden]) .qmeta { animation:fadeIn .4s ease backwards; }
  #qans:not([hidden]) { animation:popIn .4s ease; }
  .pts.bump { animation:bump .5s ease; }
  .gmk { transition:left .9s cubic-bezier(.2, .8, .2, 1); }
  .gpts { animation:popIn .4s ease; }
  #sidebar.open .sbi, #sidebar.open .sbt { animation:fadeUp .3s ease backwards; animation-delay:calc(var(--i, 0) * 22ms); }
  #toast { position:fixed; top:calc(env(safe-area-inset-top) + 56px); left:50%; z-index:50; padding:10px 18px; border-radius:999px; background:var(--accent); color:#fff; font:600 14px system-ui, sans-serif; box-shadow:0 6px 18px rgba(0,0,0,.3); opacity:0; pointer-events:none; transform:translate(-50%, 0); white-space:nowrap; }
  #toast.show { animation:toastIn 2.2s ease forwards; }
  .confetti { position:fixed; inset:0; z-index:60; overflow:hidden; pointer-events:none; }
  .confetti i { position:absolute; top:-14px; width:8px; height:14px; border-radius:2px; animation:confettiFall 2s linear forwards; }
  .cluster { grid-column:1 / -1; margin:16px 2px 0; font:600 12px system-ui, sans-serif; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .specials { grid-column:1 / -1; display:flex; gap:14px; }
  .specials .tile { flex:1; aspect-ratio:auto; flex-direction:row; padding:18px; gap:14px; min-width:0; }
  .specials .tcap { align-items:flex-start; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.001ms !important; animation-delay:0ms !important; transition-duration:.001ms !important; } }
/* Reserve a separate row for fixed navigation, including safe-area devices. */
  body, body.wide { padding-top:calc(64px + env(safe-area-inset-top)); }
  #gtext { display:grid; gap:10px; text-align:left; white-space:normal; }
  .gresult-row { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:14px 16px; border:1px solid var(--line); border-radius:12px; background:var(--card); }
  .gresult-row span { color:var(--muted); font-size:14px; }
  .gresult-row strong { text-align:right; overflow-wrap:anywhere; }
  .gresult-row.correct strong { color:var(--ok); }
  .gsummary { padding:12px; text-align:center; }
  #list .card:not(.reveal) { animation:none; }
  .scale-tools { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:16px; }
  .scale-tools button { padding:9px 12px; border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--ink); font:13px system-ui; cursor:pointer; }
  .scale-tools button:disabled { opacity:.45; cursor:default; }
  :focus-visible { outline:2px solid var(--icon); outline-offset:3px; }
  </style>

GROUPS.forEach(g => {
  const ci = CLUSTERS.findIndex(c => c[1].includes(g.name));

function updateSoundButton() {

async function playSound(kind) {
  if (!soundEnabled || document.hidden) return;
  try {
    const Audio=window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    if (!audioContext || audioContext.state === "closed") {
      audioContext=new Audio(); soundMaster=audioContext.createGain();
      soundMaster.gain.value=.18; soundMaster.connect(audioContext.destination);
    }
    if (audioContext.state === "suspended") await audioContext.resume();
    if (!soundEnabled || document.hidden || audioContext.state!=="running") return;
    // Let the exclusive reward ring clearly rather than mixing it with clicks.
    if (kind === "perfect") {
      for (const voice of activeVoices) { try { voice.stop(); } catch (_) {} }
      activeVoices.clear();
    }
    // No queues: rapid repeated gestures cannot build up a wall of sound.
    if (activeVoices.size>=8) return;
    const now=audioContext.currentTime;
    for (const [frequency,delay,duration,level=.22] of SOUND_NOTES[kind] || SOUND_NOTES.click) {
      if (activeVoices.size>=8) break;
      const oscillator=audioContext.createOscillator(), envelope=audioContext.createGain();
      oscillator.type=(kind==="error" || (kind==="perfect" && frequency<500))?"sine":"triangle";
      oscillator.frequency.value=frequency;
      const start=now+delay;
      envelope.gain.setValueAtTime(0,start);
      envelope.gain.linearRampToValueAtTime(level,start+(kind==="perfect"?.015:.008));
      envelope.gain.exponentialRampToValueAtTime(.001,start+duration);
      oscillator.connect(envelope); envelope.connect(soundMaster);
      activeVoices.add(oscillator);
      oscillator.onended=()=>{ activeVoices.delete(oscillator); oscillator.disconnect(); envelope.disconnect(); };
      oscillator.start(start); oscillator.stop(start+duration+.01);
    }
  } catch (_) { /* Audio failures must never interrupt gameplay. */ }
}
function muteSounds() {
  if (soundMaster && audioContext) soundMaster.gain.setValueAtTime(0,audioContext.currentTime);
  for (const voice of activeVoices) { try { voice.stop(); } catch (_) {} }
  activeVoices.clear();
}

// ---------- ВИБІР КАРТОК БЕЗ ПОВТОРІВ ----------
function pickCat() {
  if (!G.catQueue.length) G.catQueue = shuffle(G.group.cats);
  return G.catQueue.pop();
}
function drawItems(cat) {
  // Sorted greedy search is complete for a minimum additive/logarithmic gap.
  let q = G.queues[cat.title] || [];
  if (q.length < PER_ROUND) q = q.concat(shuffle(cat.items.filter(it => !q.includes(it))));
  const metric = it => cat.minDiff ? it[1] : Math.log(it[1]);
  const target = cat.minDiff || Math.log(cat.minRatio || 1.1);
  const select = (pool, gap) => {
    const sorted = pool.slice().sort((a,b) => metric(a)-metric(b));
    const candidates = [];
    for (let start=0; start<sorted.length; start++) {
      const chosen = [sorted[start]];
      for (let i=start+1; i<sorted.length && chosen.length<PER_ROUND; i++) {
        if (metric(sorted[i])-metric(chosen[chosen.length-1]) >= gap-1e-10) chosen.push(sorted[i]);
      }
      if (chosen.length===PER_ROUND) candidates.push(chosen);
    }
    return candidates.length ? candidates[Math.floor(Math.random()*candidates.length)] : null;
  };
  let chosen = select(q, target);
  if (!chosen) {
    q = q.concat(shuffle(cat.items.filter(it => !q.includes(it))));
    chosen = select(q, target);
  }
  if (!chosen) {
    // Find the largest feasible separation instead of an unchecked fallback.
    let lo=0, hi=target;
    chosen=select(q, 0);
    for (let i=0; i<32; i++) {
      const mid=(lo+hi)/2, trial=select(q, mid);
      if (trial) { lo=mid; chosen=trial; } else hi=mid;
    }
  }
  if (!chosen) throw new Error("Недостатньо карток для раунду.");
  G.queues[cat.title] = q.filter(it => !chosen.includes(it));
  return chosen.map(([name,value]) => ({name,value}));
}

// ---------- DRAG & DROP (зверху вниз; номери місць оновлюються наживо; DOM міняємо при відпусканні) ----------
function startDrag(e, el) {
  if (locked || (e.pointerType === "mouse" && e.button !== 0)) return;
  e.preventDefault();
  const cards = [...list.children];
  const from = cards.indexOf(el);
  const rects = cards.map(c => c.getBoundingClientRect());
  const shift = rects[from].height + 8;
  const grab = e.clientY - rects[from].top;
  let to = from, done = false;
  el.setPointerCapture(e.pointerId);
  el.classList.add("drag");

  const move = ev => {
    const dy = ev.clientY - grab - rects[from].top;
    el.style.transform = "translateY(" + dy + "px) scale(1.03)";
    const center = rects[from].top + dy + rects[from].height / 2;
    to = 0;
    cards.forEach((_, i) => { if (i !== from && rects[i].top + rects[i].height / 2 < center) to++; });
    cards.forEach((c, i) => {
      if (i === from) return;
      const sh = (i > from && i <= to) ? -shift : (i < from && i >= to) ? shift : 0;
      c.style.transform = sh ? "translateY(" + sh + "px)" : "";
      c.querySelector(".num").textContent = i + (sh < 0 ? -1 : sh > 0 ? 1 : 0) + 1;
    });
    el.querySelector(".num").textContent = to + 1;
  };
  const end = () => {
    if (done) return; done = true;
    el.removeEventListener("pointermove", move);
    el.removeEventListener("pointerup", end);
    el.removeEventListener("pointercancel", end);
    list.classList.add("settle");
    const order = cards.filter(c => c !== el);
    order.splice(to, 0, el);
    order.forEach(c => { c.style.transform = ""; list.appendChild(c); });
    el.classList.remove("drag");
    renumber();
    requestAnimationFrame(() => requestAnimationFrame(() => list.classList.remove("settle")));
  };
  el.addEventListener("pointermove", move);
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

// ---------- ПЕРЕВІРКА ----------
function check() {
  locked = true;
  const userOrder = [...list.children].map(c => c.dataset.name);
  const userPos = Object.fromEntries(userOrder.map((n, i) => [n, i]));

  const logs = current.correct.map(it => Math.log(it.value));
  const lo = Math.min(...logs) - 0.3, hi = Math.max(...logs);
  let right = 0;
  list.innerHTML = "";
  list.className = "locked";

  current.correct.forEach((it, i) => {
    const u = userPos[it.name];
    const diff = u - i;                      // >0: стояла надто низько, треба було вище
    const el = makeCard(it);
    el.classList.add("reveal"); el.style.setProperty("--i", i);
    el.querySelector(".num").textContent = i + 1;
    const mark = el.querySelector(".mark");
    if (diff === 0) { right++; mark.textContent = "✓"; el.classList.add("ok"); }
    else {
      mark.textContent = (diff > 0 ? "↑" : "↓") + Math.abs(diff);
      mark.title = (diff > 0 ? "Треба було підняти на " : "Треба було опустити на ") + Math.abs(diff);
      el.classList.add(Math.abs(diff) === 1 ? "mid" : "bad");
    }
    const pct = 100 * (Math.log(it.value) - lo) / (hi - lo);
    el.insertAdjacentHTML("afterbegin", '<div class="bar" style="width:0"></div>');
    requestAnimationFrame(() => requestAnimationFrame(() => { el.querySelector(".bar").style.width = pct + "%"; }));
    el.querySelector(".val").innerHTML = "<b>" + fv(current.cat, it.value) + "</b> " + current.cat.unit;
    list.appendChild(el);
  });

  playSound(right === PER_ROUND ? "perfect" : right >= 3 ? "success" : "error");
  G.score += right; G.max += PER_ROUND;
  let text = "На своєму місці: " + right + " з " + PER_ROUND + (right === PER_ROUND ? " — ідеально!" : "") +
    ". Стрілка показує, куди треба було пересунути картку.";

  if (right === PER_ROUND) confetti();
  if (G.round >= ROUNDS) {
    const p = Math.round(100 * G.score / G.max);
    const prev = Number(store.get("best_" + G.group.name) || 0);
    if (p > prev) { store.set("best_" + G.group.name, p); confetti(60); }
    text += "<br><b>Підсумок: " + G.score + " з " + G.max + " (" + p + "%)" +
      (p > prev ? " — новий рекорд!" : ", рекорд " + prev + "%") + "</b>";
    mode = "menu"; $("btn").textContent = "До меню";
  } else {
    mode = "next"; $("btn").textContent = "Наступний раунд";
  }
  $("result").innerHTML = text;
}

const QPTS = [100, 200, 300, 400, 500];
const MAX_PLAYERS = 8;
let Q = null, PL = null, CUSTOM = null, prevScores = null;

const nm = i => (Q.players[i].name || "").trim() || "Гравець " + (i + 1);
const saveNames = () => store.set("quiz_players", JSON.stringify(PL.map(p => p.name)));
const activeIdx = () => Q.open ? Q.open.current : Q.turn;

function loadPlayers() {
  if (PL) return;
  let names = null;
  try { names = JSON.parse(store.get("quiz_players") || "null"); } catch (e) {}
  if (!Array.isArray(names) || !names.length || names.length > MAX_PLAYERS) names = ["Гравець 1", "Гравець 2"];
  PL = names.map(n => ({ name: String(n), score: 0 }));
}
function loadCustom() {
  if (CUSTOM) return;
  let raw = [];
  try { raw = JSON.parse(store.get("custom_quiz") || "[]"); } catch (e) {}
  if (!Array.isArray(raw)) raw = [];
  CUSTOM = raw.filter(c => c && typeof c.name === "string" && Array.isArray(c.qs)).map(c => ({
    name: c.name,
    qs: Array.from({ length: 5 }, (_, i) => { const p = c.qs[i] || []; return [String(p[0] || ""), String(p[1] || "")]; }),
  }));
}
const saveCustom = () => store.set("custom_quiz", JSON.stringify(CUSTOM));
const filled = c => c.qs.some(p => p[0] && p[1]);
// Кілька питань на однаковий рівень (позиція % 5): у грі береться випадкове з кожного рівня.
const toSlots = qs => {
  const lv = [[], [], [], [], []];
  qs.forEach((x, i) => { if (x && x[0] && x[1]) lv[i % 5].push(x); });
  return lv.map(l => { if (!l.length) return null; const x = l[Math.floor(Math.random() * l.length)]; return { q: x[0], a: x[1], used: false }; });
};

function openQuiz() {
  loadPlayers(); loadCustom(); prevScores = null;
  Q = { cats: [], players: PL, turn: 0, used: 0, total: 0, open: null, pool: "std" };
  show("quiz");
  showSetup();
}
function showSetup() {
  Q.open = null; Q.cats = [];
  $("board").hidden = true; $("qview").hidden = true; $("qend").hidden = true; $("qend").innerHTML = ""; $("qturn").hidden = true;
  const box = $("qsetup"); box.hidden = false; box.innerHTML = "";
  const h = document.createElement("h2"); h.className = "title"; h.textContent = "Вікторина"; box.appendChild(h);
  const sub = document.createElement("div"); sub.className = "sub"; sub.textContent = "Обери набір категорій. Гравців та їхні імена задай унизу екрана."; box.appendChild(sub);
  const mine = CUSTOM.filter(filled);
  const opt = (title, desc, pool, enabled) => {
    const b = document.createElement("button"); b.className = "pool"; b.disabled = !enabled;
    b.innerHTML = "<span></span><small></small>"; b.firstChild.textContent = title; b.lastChild.textContent = desc;
    b.onclick = () => startQuiz(pool); box.appendChild(b);
  };
  opt("Стандартні", QUIZ.length + " категорій, на гру береться п'ять випадкових", "std", true);
  opt("Мої", mine.length ? mine.length + " моїх категорій" : "Ще немає своїх категорій — створи їх у редакторі", "mine", mine.length > 0);
  opt("Усі разом", "Стандартні й мої разом", "all", mine.length > 0);
  const ed = document.createElement("button"); ed.className = "wbtn alt"; ed.textContent = "Редактор своїх питань"; ed.onclick = showEditor; box.appendChild(ed);
  renderPlayers();
}
function startQuiz(pool) {
  const base = QUIZ.map(c => ({ name: c.name, qs: c.qs.map(x => [x[0], x[1]]) }));
  const mine = CUSTOM.filter(filled);
  const src = pool === "mine" ? mine : pool === "all" ? [...base, ...mine] : base;
  PL.forEach(p => { p.score = 0; }); prevScores = null;
  Q.pool = pool;
  Q.cats = shuffle(src).slice(0, 5).map(c => ({ name: c.name, qs: toSlots(c.qs) }));
  Q.total = Q.cats.reduce((n, c) => n + c.qs.filter(Boolean).length, 0);
  Q.turn = 0; Q.used = 0; Q.open = null;
  $("qsetup").hidden = true;
  renderBoard();
}

function renderPlayers() {
  const box = $("players"); box.innerHTML = "";
  const row = document.createElement("div"); row.className = "plrow";
  const playing = !$("board").hidden || !$("qview").hidden;
  Q.players.forEach((p, i) => {
    const d = document.createElement("div");
    d.className = "pl" + (playing && i === activeIdx() ? " cur" : "");
    const pts = document.createElement("div"); pts.className = "pts"; pts.textContent = p.score;
    if (prevScores && prevScores[i] !== undefined && prevScores[i] !== p.score) pts.classList.add("bump");
    const inp = document.createElement("input");
    inp.value = p.name; inp.maxLength = 14; inp.placeholder = "Гравець " + (i + 1);
    inp.setAttribute("aria-label", "Ім'я гравця " + (i + 1));
    inp.oninput = () => { p.name = inp.value; saveNames(); if (!$("board").hidden) updateTurnText(); };
    d.append(pts, inp); row.appendChild(d);
  });
  prevScores = Q.players.map(p => p.score);
  const ctl = document.createElement("div"); ctl.className = "pctl";
  const minus = document.createElement("button"); minus.textContent = "−"; minus.title = "Менше гравців";
  const plus = document.createElement("button"); plus.textContent = "+"; plus.title = "Більше гравців";
  const locked = !!Q.open || !$("qend").hidden;
  minus.disabled = locked || Q.players.length <= 1;
  plus.disabled = locked || Q.players.length >= MAX_PLAYERS;
  minus.onclick = () => { PL.pop(); if (Q.turn >= PL.length) Q.turn = 0; saveNames(); if (!$("board").hidden) updateTurnText(); renderPlayers(); };
  plus.onclick = () => { PL.push({ name: "Гравець " + (PL.length + 1), score: 0 }); saveNames(); renderPlayers(); };
  ctl.append(plus, minus);
  box.append(row, ctl);
}

function updateTurnText() { $("qturn").textContent = "Обирає: " + nm(Q.turn) + " — вибери категорію й складність"; }

function renderBoard() {
  $("qview").hidden = true; $("qend").hidden = true; $("qend").innerHTML = ""; $("qsetup").hidden = true; $("board").hidden = false; $("qturn").hidden = false;
  const b = $("board"); b.innerHTML = "";
  b.style.gridTemplateColumns = "repeat(" + Q.cats.length + ", minmax(0, 1fr))";
  Q.cats.forEach(c => { const h = document.createElement("div"); h.className = "bh"; h.textContent = c.name; b.appendChild(h); });
  for (let r = 0; r < 5; r++) Q.cats.forEach((c, ci) => {
    const q = c.qs[r];
    const btn = document.createElement("button");
    btn.className = "bc"; btn.textContent = q ? QPTS[r] : ""; btn.disabled = !q || q.used; btn.style.setProperty("--i", r + ci);
    if (q) btn.onclick = () => openQuestion(ci, r);
    b.appendChild(btn);
  });
  updateTurnText();
  renderPlayers();
}

function openQuestion(ci, r) {
  const q = Q.cats[ci].qs[r], N = Q.players.length;
  const order = []; for (let k = 1; k < N; k++) order.push((Q.turn + k) % N);
  Q.open = { ci, r, q, pts: QPTS[r], picker: Q.turn, current: Q.turn, order, phase: "ask", msg: "" };
  $("board").hidden = true; $("qturn").hidden = true; $("qview").hidden = false;
  playSound("click");
  renderQuestion();
}

// фази: ask (питання на екрані) → judge (показана відповідь, оцінка) → offer (пропозиція наступному) / done
function renderQuestion() {
  const o = Q.open, shown = o.phase === "judge" || o.phase === "done";
  $("qmeta").textContent = Q.cats[o.ci].name + " · " + o.pts;
  $("qtext").textContent = o.q.q;
  $("qans").hidden = !shown; $("qans").textContent = o.q.a;
  const act = $("qactions"); act.innerHTML = "";
  const add = (text, fn, cls) => { const b = document.createElement("button"); b.textContent = text; if (cls) b.className = cls; b.onclick = fn; act.appendChild(b); };
  const pre = o.msg ? o.msg + " " : "";
  let note = "", hint = "";
  if (o.phase === "ask") {
    note = pre + "Відповідає: " + nm(o.current) + ". Правильно: +" + o.pts + ", неправильно: −" + o.pts + ".";
    hint = "Натисни на екран або пробіл — показати відповідь";
  } else if (o.phase === "judge") {
    note = nm(o.current) + " відповів правильно?";
    add("✓ Правильно +" + o.pts, () => judge(true), "good");
    add("✗ Неправильно −" + o.pts, () => judge(false), "bad");
  } else if (o.phase === "offer") {
    note = pre + nm(o.current) + ", відповідаєш? Правильно: +" + o.pts + ", неправильно: −" + o.pts + ".";
    add("Відповідаю", () => { o.phase = "ask"; o.msg = ""; renderQuestion(); });
    add("Пас", () => advance(nm(o.current) + " пасує."), "alt");
  } else {
    note = o.msg;
    add("Далі", finishQuestion);
    hint = "Пробіл — далі";
  }
  $("qnote").textContent = note;
  $("qhint").textContent = hint;
  renderPlayers();
}

function reveal() { if (Q && Q.open && Q.open.phase === "ask") { Q.open.phase = "judge"; playSound("reveal"); renderQuestion(); } }

function judge(ok) {
  playSound(ok ? "success" : "error");
  const o = Q.open, p = Q.players[o.current];
  if (ok) { p.score += o.pts; o.phase = "done"; o.msg = "Правильно! " + nm(o.current) + ": +" + o.pts + "."; return renderQuestion(); }
  p.score -= o.pts;
  advance(nm(o.current) + " помилився: −" + o.pts + ".");
}

function advance(msg) {     // передати можливість наступному гравцю або закінчити питання
  const o = Q.open;
  if (o.order.length) { o.current = o.order.shift(); o.phase = "offer"; o.msg = msg; }
  else { o.phase = "done"; o.msg = msg + " Ніхто не відповів правильно."; }
  renderQuestion();
}

function finishQuestion() {
  const o = Q.open;
  Q.cats[o.ci].qs[o.r].used = true; Q.used++;
  Q.turn = (o.picker + 1) % Q.players.length;
  Q.open = null;
  if (Q.used >= Q.total) endQuiz(); else renderBoard();
}

function endQuiz() {
  $("qview").hidden = true; $("board").hidden = true; $("qturn").hidden = true;
  const end = $("qend"); end.hidden = false; end.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = "Гру завершено"; end.appendChild(h);
  const sorted = Q.players.map((p, i) => ({ n: nm(i), s: p.score })).sort((a, b) => b.s - a.s);
  sorted.forEach(x => {
    const d = document.createElement("div"); d.className = "endrow" + (x.s === sorted[0].s ? " win" : "");
    const n = document.createElement("span"); n.textContent = x.n;
    const s = document.createElement("b"); s.textContent = x.s;
    d.append(n, s); end.appendChild(d);
  });
  const btns = document.createElement("div"); btns.className = "btns";
  const again = document.createElement("button"); again.textContent = "Нова гра"; again.onclick = () => startQuiz(Q.pool);
  const sets = document.createElement("button"); sets.textContent = "Інший набір"; sets.className = "alt"; sets.onclick = showSetup;
  const home = document.createElement("button"); home.textContent = "До меню"; home.className = "alt"; home.onclick = showHome;
  btns.append(again, sets, home); end.appendChild(btns);
  confetti(60);
  playSound("win");
  renderPlayers();
}

// ---------- ВГАДАЙ ЗНАЧЕННЯ ----------
// Бали = 100·exp(−2·|ln(твоє / правильне)|): важить, у скільки разів помилився.
// Для років те саме, але рахується «скільки років тому» — тож помилка в 10 років важлива для 1991, але дрібна для 1066.
const GUESS_ROUNDS = 10, THIS_YEAR = new Date().getFullYear();
let V = null;
const isYear = cat => cat.unit === "р.";

// All sliders are linear: the same movement always means the same difference.
// The log-based relative-error scoring below is independent of the slider.
function linearScale(lo, hi, step) {
  const decimals = Math.max(0, Math.min(3, Math.round(-Math.log10(step))));
  const clean = v => Number(v.toFixed(decimals));
  const clamp = v => Math.min(hi, Math.max(lo, v));
  return {
    minLabel:lo, maxLabel:hi, step, decimals,
    ticks:Math.max(1, Math.round((hi-lo)/step)),
    toVal:p => clean(clamp(lo+Math.round(Math.min(1,Math.max(0,p))*(hi-lo)/step)*step)),
    toPos:v => Math.min(1, Math.max(0, (v-lo)/(hi-lo))),

}
function makeScale(cat, whole) {

  if (isYear(cat)) {
    const span=vmax-vmin, unit=span<=100?5:span<=500?10:50;
    const margin=Math.max(5,span*.1);
    const lo=Math.max(1,Math.floor((vmin-margin)/unit)*unit);
    const hi=Math.max(vmax, Math.min(THIS_YEAR,Math.ceil((vmax+margin)/unit)*unit));
    return linearScale(lo,Math.max(lo+1,hi),1);
  }

  const nice=[1,2,5,10].map(n=>n*magnitude).find(n=>n>=rough);
  const lo=Math.max(step,Math.floor((vmin-span*.1)/nice)*nice);
  const hi=Math.ceil((vmax+span*.1)/nice)*nice;

}
const gfmt = (cur,v) => String(Number(v.toFixed(cur.sc.decimals)));
const glab = (cur,v) => isYear(cur.cat) ? String(Math.round(v)) : fmt(v);
function updateGuessSlider(value) {
  const {sc}=V.cur;
  const slider=$("gslider"); slider.max=sc.ticks; slider.value=Math.round(sc.toPos(value)*sc.ticks);
  slider.setAttribute("aria-valuetext",fv(V.cur.cat,value)+" "+V.cur.cat.unit);
  $("gmin").textContent=glab(V.cur,sc.minLabel); $("gmax").textContent=glab(V.cur,sc.maxLabel);

}
function refineGuessScale(reset=false) {
  if (!V || V.phase!=="guess") return;
  const cur=V.cur, value=parseNum($("gval").value), base=cur.bounds;
  if (!Number.isFinite(value) || value<base.minLabel || value>base.maxLabel) { $("gerr").textContent="Спочатку введи число в межах повного діапазону."; return; }
  if (reset) cur.sc=base;

function guessScore(cat, g, t) {

function startGuess(group) {

}
function nextGuess() {

  const item = q.pop(); V.queues[cat.title] = q;
  const whole = cat.items.every(i => Number.isInteger(i[1])), sc = makeScale(cat, whole); V.cur = { cat, item, sc, bounds:sc, whole };

  $("gtitle").textContent = cat.title;
  $("gq").textContent = item[0];
  $("gunit").textContent = cat.unit;
  updateGuessSlider(mid);
  $("gval").value = gfmt(V.cur, mid);
  $("gmin").textContent = glab(V.cur, sc.minLabel); $("gmax").textContent = glab(V.cur, sc.maxLabel);
  $("gcap").textContent = isYear(cat) ? "Рівномірна шкала років · крок 1 рік. Ближча відповідь — більше балів." : "Рівномірна шкала. Для точності звузь діапазон або введи число. Бали: ×1,1 → 83 · ×2 → 25.";

}
function confirmGuess() {

  const { cat, item, bounds:sc } = V.cur;
  const g = parseNum($("gval").value);
  if (!Number.isFinite(g) || !(g > 0)) { $("gerr").textContent = "Введи додатне скінченне число."; return; }
  if (isYear(cat) && !Number.isInteger(g)) { $("gerr").textContent = "Введи цілий рік."; return; }
  if (g < sc.minLabel || g > sc.maxLabel) { $("gerr").textContent = "Введи значення від " + fv(cat, sc.minLabel) + " до " + fv(cat, sc.maxLabel) + "."; return; }
  const t = item[1], pts = guessScore(cat, g, t);

  $("gform").hidden = true; $("gres").hidden = false;
  const tr = $("gtrack"); tr.innerHTML = "";
  [[g, "ти", ""], [t, "правильно", "t"]].forEach(([v, label, cls]) => {
    const m = document.createElement("div"); m.className = "gmk " + cls; m.style.left = "0%";
    const s = document.createElement("span"); s.textContent = label; m.appendChild(s); tr.appendChild(m);
    requestAnimationFrame(() => requestAnimationFrame(() => { m.style.left = (100 * sc.toPos(v)) + "%"; }));

  }

  $("gprog").textContent = "Питання " + V.round + " з " + GUESS_ROUNDS + " · Бали: " + V.score;

  [["Правильно", fv(cat,t)+" "+cat.unit, "correct"], ["Твоя відповідь", fv(cat,g)+" "+cat.unit, ""], ["Відхилення", dev.replace(/^(Помилка|Відхилення): /, ""), ""]].forEach(([label,value,cls]) => {
    const row=document.createElement("div"); row.className="gresult-row "+cls;
    const caption=document.createElement("span"), result=document.createElement("strong");
    caption.textContent=label; result.textContent=value; row.append(caption,result); box.append(row);
  });

}

// CSV: категорія;бали;питання;відповідь  (роздільник ; — для Excel; при імпорті розпізнається ; , або табуляція)
const csvCell = v => /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
function exportCSV() {
  const rows = ["категорія;бали;питання;відповідь"];
  CUSTOM.forEach(c => c.qs.forEach((p, i) => { if (p[0] && p[1]) rows.push([c.name, String((i + 1) * 100), p[0], p[1]].map(csvCell).join(";")); }));
  return rows.join("\r\n");
}
function exportJSON() {
  return JSON.stringify({ version: 1, categories: CUSTOM.map(c => ({ name: c.name,
    questions: c.qs.map((p, i) => p[0] && p[1] ? { points: (i + 1) * 100, q: p[0], a: p[1] } : null).filter(Boolean) })) }, null, 2);
}
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, "");

  const delim = [";", "\t", ","].reduce((best, ch) => count(ch) > count(best) ? ch : best, ";");

    else if (c === '"') inQ = true;

    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); cell = ""; if (row.some(x => x.trim())) rows.push(row); row = []; }
    else cell += c;

}
function importData(text) {
  const t = text.trim();
  if (!t) throw new Error("поле порожнє");
  const incoming = []; let skipped = 0;
  const getCat = name => {
    if (typeof name !== "string") return null;
    name = name.trim(); if (!name || name.length > 30) return null;
    let c = incoming.find(x => x.name === name);
    if (!c) { c = { name, qs: Array.from({ length: 5 }, () => ["", ""]) }; incoming.push(c); }
    return c;
  };

    if (slot < 0 || cat.qs[slot][0]) { skipped++; return; }

    const j = JSON.parse(t);
    const categories = Array.isArray(j) ? j : j && j.categories;
    if (!Array.isArray(categories)) throw new Error("очікується масив categories");
    categories.forEach(cj => {
      if (!cj || typeof cj !== "object" || !Array.isArray(cj.questions || cj.qs)) { skipped++; return; }
      const c = getCat(cj.name || cj.category);
      if (!c) { skipped++; return; }
      (cj.questions || cj.qs).forEach((x,i) => { if (Array.isArray(x)) { if (i < 5) addQ(c, QPTS[i], x[0], x[1]); else skipped++; } else if (x && typeof x === "object") addQ(c, x.points ?? x.pts ?? NaN, x.q ?? x.question, x.a ?? x.answer); else skipped++; });
    });
  } else {
    const rows = parseCSV(t);
    if (rows.length && /^(бали|points|pts)$/i.test(String(rows[0][1]).trim())) rows.shift();   // рядок заголовка
    rows.forEach(r => { const c = r.length === 4 ? getCat(r[0]) : null; if (!c) { skipped++; return; } addQ(c, r[1], r[2], r[3]); });
  }
  loadCustom();
  const merged = CUSTOM.map(c => ({name:c.name, qs:c.qs.map(p => p.slice())}));
  let qn=0, cats=0;
  incoming.forEach(c => {
    let ex=merged.find(x => x.name===c.name), added=0;
    if (!ex) ex={name:c.name, qs:Array.from({length:5},()=>["",""])};
    c.qs.forEach((p,i) => {
      if (!p[0] || !p[1]) return;
      if (ex.qs[i][0] || ex.qs[i][1]) { skipped++; return; }
      ex.qs[i]=p; qn++; added++;
    });
    if (added) { cats++; if (!merged.includes(ex)) merged.push(ex); }
  });
  if (qn && !store.set("custom_quiz", JSON.stringify(merged))) throw new Error("не вдалося зберегти питання у браузері");
  CUSTOM=merged;
  return {cats,qn,skipped};
}

const reducedMotion = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
function toast(msg) {

function confetti(n = 40) {
  if (reducedMotion()) return;
  const box = document.createElement("div"); box.className = "confetti";
  const colors = ["#e58a9b", "#f2c230", "#43b27a", "#3a78d8", "#e8604f"];
  for (let i = 0; i < n; i++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "%";
    p.style.background = colors[i % colors.length];
    p.style.animationDelay = Math.random() * 0.4 + "s";
    p.style.animationDuration = 1.6 + Math.random() * 1.2 + "s";
    p.style.setProperty("--dx", Math.round(Math.random() * 120 - 60) + "px");
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 3400);
}
function countUp(el, to) {   // число «набігає» від нуля
  el.dataset.pts = to;
  if (reducedMotion() || to <= 0) { el.textContent = "+" + to; return; }
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / 700);
    el.textContent = "+" + Math.round(to * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

    if (t === "BUTTON") return;
    if (V.phase === "guess" && (e.code === "Enter" || e.code === "NumpadEnter")) { e.preventDefault(); confirmGuess(); }
    else if (V.phase === "done" && (e.code === "Enter" || e.code === "NumpadEnter" || e.code === "Space")) { e.preventDefault(); nextGuess(); }
    return;
  }
  if (e.code !== "Space" || !Q || !Q.open || $("quiz").hidden) return;     // вікторина: пробіл
  if (t === "INPUT" || t === "TEXTAREA" || t === "BUTTON") return;
  e.preventDefault();
  if (Q.open.phase === "ask") reveal(); else if (Q.open.phase === "done") finishQuestion();
});
$("menubtn").onclick = openSidebar;
$("sbback").onclick = closeSidebar;
document.addEventListener("click", e => { const b = e.target.closest("[data-legal]"); if (b) navigate(() => showLegal(b.dataset.legal)); });
showHome();
</script>
